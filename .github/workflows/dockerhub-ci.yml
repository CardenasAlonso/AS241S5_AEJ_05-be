name: Docker Hub + SonarCloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  # Trabajo 1: Verifica el código (Pruebas + SonarCloud)
  build-and-analyze:
    name: Test & SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Requerido por SonarCloud

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Executa pruebas, genera reportes y los envía a SonarCloud de un solo golpe
      - name: Build, Test and Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=CardenasAlonso_AS241S5_AEJ_05-be \
            -Dsonar.organization=cardenasalonso \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # Trabajo 2: Construcción y despliegue en Docker Hub
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-analyze
    # Se ejecuta solo en push a las ramas principales y si el análisis previo pasó exitosamente
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_HANCEL }}
          password: ${{ secrets.DOCKERHUB_TOKEN_HANCEL }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_HANCEL }}/as241s5_aej_05-be:latest
            ${{ secrets.DOCKERHUB_USERNAME_HANCEL }}/as241s5_aej_05-be:${{ github.sha }}
